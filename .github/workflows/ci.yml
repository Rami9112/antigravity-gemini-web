name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS Apple Silicon (darwin-arm64)
          - os: windows-latest
            label: Windows x64 (win32-x64)
          - os: windows-11-arm
            label: Windows ARM64 (win32-arm64)
          - os: ubuntu-latest
            label: Linux x64 (linux-x64)
          - os: ubuntu-24.04-arm
            label: Linux ARM64 (linux-arm64)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Run unified verification script
        shell: bash
        run: bash scripts/verify.sh
